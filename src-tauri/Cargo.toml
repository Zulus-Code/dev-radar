[package]
name = "dev-radar"
version = "0.1.0"
description = "Radar for GitHub projects and trends"
authors = ["zulus"]
license = "MIT"
repository = "https://github.com/Zulus-Code/dev-radar"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "dev_radar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
